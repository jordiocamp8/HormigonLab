    add('Masa de grava seca y SSS','Mg,seca = b × ρcompactada; Mg,SSS = Mg,seca × (1 + Absg / 100)','ρcompactada: masa unitaria seca compactada; Absg: absorción de grava.',`b = ${fmt(r.coarseFraction)}; ρcompactada = ${fmt(d.rodded)} kg/m³; Absg = ${fmt(d.coarseAbs)} %.`,`${fmt(r.coarseFraction)} × ${fmt(d.rodded)} = ${fmt(r.coarse.dry)}; ${fmt(r.coarse.dry)} × (1 + ${fmt(d.coarseAbs)} / 100)`,`seca = ${fmt(r.coarse.dry)}; SSS = ${fmt(r.coarse.ssd)}`,'kg/m³',refs.coarse);
    add('Aditivo y su agua','Mad = C × dosis / 100; Wad = Mad × fracciónagua / 100','Mad: masa de producto líquido; Wad: agua contenida en ese producto.',`C = ${fmt(r.cement)}; dosis = ${fmt(d.admDose)} % de cemento; agua en producto = ${fmt(d.admWater)} %.`,d.admDose===0?'Dosis cero → producto = 0; agua de aditivo = 0':`${fmt(r.cement)} × ${fmt(d.admDose)} / 100 = ${fmt(r.admixture)}; ${fmt(r.admixture)} × ${fmt(d.admWater)} / 100`,`producto = ${fmt(r.admixture)}; agua = ${fmt(r.admixtureWater)}`,'kg/m³','Balance de masa con datos de ficha técnica del aditivo; no se supone una reducción de agua automática.');
    const gs=r.coarseSGSSD??d.coarseSG, fs=r.fineSGSSD??d.fineSG;
    const volumeItems=[
      ['cement','Cemento','Vc = C / (Gc × ρagua)',`${fmt(r.cement)} / (${fmt(d.cementSG)} × 1000)`],
      ['water','Agua efectiva','Vw = W / ρagua',`${fmt(r.water)} / 1000`],
      ['coarse','Grava SSS','Vg = Mg,SSS / (Gg,SSS × ρagua)',`${fmt(r.coarse.ssd)} / (${fmt(gs)} × 1000)`],
      ['air','Aire','Vaire = aire (%) / 100',`${fmt(d.air)} / 100`],
      ['admixture','Volumen residual del aditivo','Vad,neto = Mad / ρad − Wad / ρagua',d.admDose===0?'Sin aditivo → 0':`${fmt(r.admixture)} / ${fmt(d.admDensity)} − ${fmt(r.admixtureWater)} / 1000`]
    ];
    for(const [key,name,equation,sub] of volumeItems)add(`Volumen absoluto · ${name}`,equation,'V: volumen por m³ de hormigón; G: densidad relativa; ρ: densidad en kg/m³. El agua del aditivo ya está contenida en W.',`ρagua = 1000 kg/m³${key==='admixture'?`; ρad = ${fmt(d.admDensity)} kg/m³`:''}.`,sub,fmt(r.volumes[key],9),'m³/m³',refs.volume);
    add('Volumen y masa SSS de arena','Va = 1 − (Vc + Vw + Vg + Vaire + Vad,neto); Ma,SSS = Va × Ga,SSS × ρagua','La arena completa el volumen objetivo de 1 m³.',`Ga,SSS = ${fmt(fs)}; ρagua = 1000 kg/m³.`,`1 − (${['cement','water','coarse','air','admixture'].map(k=>fmt(r.volumes[k],9)).join(' + ')}) = ${fmt(r.volumes.fine,9)}; ${fmt(r.volumes.fine,9)} × ${fmt(fs)} × 1000`,`Va = ${fmt(r.volumes.fine,9)} m³; Ma,SSS = ${fmt(r.fine.ssd)} kg`,'por 1 m³ de mezcla',refs.volume);
    for(const [key,name] of [['fine','Arena'],['coarse','Grava']]){
      const a=r[key];
      add(`Corrección de humedad · ${name}`,'Mseca = MSSS / (1 + Abs / 100); Mhúmeda = Mseca × (1 + H / 100); Wlibre = Mhúmeda − MSSS','H: humedad total; Abs: absorción; ambas en % de masa seca. Si H < Abs, Wlibre es negativa y representa déficit para alcanzar SSS.',`MSSS = ${fmt(a.ssd)} kg; Abs = ${fmt(d[key+'Abs'])} %; H = ${fmt(d[key+'Moist'])} %.`,`${fmt(a.ssd)} / (1 + ${fmt(d[key+'Abs'])} / 100) = ${fmt(a.dry)}; ${fmt(a.dry)} × (1 + ${fmt(d[key+'Moist'])} / 100) = ${fmt(a.wet)}; ${fmt(a.wet)} − ${fmt(a.ssd)}`,`Mseca = ${fmt(a.dry)}; Mhúmeda = ${fmt(a.wet)}; Wlibre = ${fmt(a.free)}`,'kg/m³',refs.moisture);
    }
    add('Agua que se debe añadir','Wañadir = W − Wlibre,arena − Wlibre,grava − Wad','W: agua efectiva de diseño; Wlibre: aporte neto o déficit de cada árido; Wad: agua del aditivo.',`W = ${fmt(r.water)}; Wlibre,arena = ${fmt(r.fine.free)}; Wlibre,grava = ${fmt(r.coarse.free)}; Wad = ${fmt(r.admixtureWater)} kg/m³.`,`${fmt(r.water)} − (${fmt(r.fine.free)}) − (${fmt(r.coarse.free)}) − ${fmt(r.admixtureWater)}`,fmt(r.addedWater),'kg/m³ ≈ L/m³ con ρagua = 1000',refs.moisture);
    const wr=r.rows.find(x=>x.key==='water');
    if(wr)add('Escenarios de agua de amasado','Wañadir,secos = W + Σ(MSSS − Mseca) − Wad; Wañadir,SSS = W − Wad','Son alternativas de agua a añadir según condición de los áridos, no estados secos o húmedos del agua.',`Absorción arena = ${fmt(r.fine.ssd-r.fine.dry)}; absorción grava = ${fmt(r.coarse.ssd-r.coarse.dry)} kg/m³.`,`${fmt(r.water)} + ${fmt(r.fine.ssd-r.fine.dry)} + ${fmt(r.coarse.ssd-r.coarse.dry)} − ${fmt(r.admixtureWater)}; ${fmt(r.water)} − ${fmt(r.admixtureWater)}`,`con áridos secos = ${fmt(wr.dry)}; con áridos SSS = ${fmt(wr.ssd)}; con humedad ingresada = ${fmt(wr.wet)}`,'kg/m³ de agua a añadir',refs.moisture);
    add('Comprobaciones de conservación','ΣV = 1; Wreconstruida = Wañadir + Wlibre,arena + Wlibre,grava + Wad','El cierre verifica balances matemáticos, no demuestra resistencia, durabilidad ni trabajabilidad.',`Volúmenes calculados por el motor; agua efectiva = ${fmt(r.water)} kg/m³.`,`${Object.values(r.volumes).map(v=>fmt(v,9)).join(' + ')}; ${fmt(r.addedWater)} + (${fmt(r.fine.free)}) + (${fmt(r.coarse.free)}) + ${fmt(r.admixtureWater)}`,`ΣV = ${fmt(r.totalVolume,9)} m³; Wreconstruida = ${fmt(r.addedWater+r.fine.free+r.coarse.free+r.admixtureWater)} kg/m³`,'m³ y kg/m³',refs.volume);
    add('Masa total teórica','Mtotal = C + Ma,húmeda + Mg,húmeda + Wañadir + Mad','La masa de 1 m³ teórico equivale a su densidad teórica; la densidad fresca se mide por ensayo.',`Materiales realmente dosificados con la humedad ingresada.`,`${fmt(r.cement)} + ${fmt(r.fine.wet)} + ${fmt(r.coarse.wet)} + ${fmt(r.addedWater)} + ${fmt(r.admixture)}`,fmt(r.totalMass),'kg/m³','Conservación de masa; el rendimiento real exige densidad medida y masa realmente dosificada.');
    add('Proporciones SSS y sacos equivalentes','C : Ma,SSS : Mg,SSS = 1 : (Ma,SSS / C) : (Mg,SSS / C); sacos = C / msaco','Proporciones por masa, no por volumen de baldes; msaco: masa declarada por saco.',`msaco = ${fmt(d.bag)} kg.`,`${fmt(r.fine.ssd)} / ${fmt(r.cement)}; ${fmt(r.coarse.ssd)} / ${fmt(r.cement)}; ${fmt(r.cement)} / ${fmt(d.bag)}`,`1 : ${fmt(r.ratio[1])} : ${fmt(r.ratio[2])}; a/c = ${fmt(r.actualWC)}; sacos = ${fmt(r.cement/d.bag)}`,'adimensional; sacos/m³',refs.volume);
    add('Volumen de producción y mezcladas','Vtotal = Vneto × (1 + reserva / 100); N = techo(Vtotal / (capacidadL / 1000)); Vmezclada = Vtotal / N','La reserva se aplica una sola vez; todas las mezcladas tienen igual volumen y respetan la capacidad útil.',`Vneto = ${fmt(d.volume)} m³; reserva = ${fmt(d.waste)} %; capacidad = ${fmt(d.mixer)} L.`,`${fmt(d.volume)} × (1 + ${fmt(d.waste)} / 100) = ${fmt(r.batchVolume)}; techo(${fmt(r.batchVolume)} / (${fmt(d.mixer)} / 1000)) = ${r.batches}; ${fmt(r.batchVolume)} / ${r.batches}`,`Vtotal = ${fmt(r.batchVolume)} m³; N = ${r.batches}; Vmezclada = ${fmt(r.perBatch,9)} m³`,'m³ y unidades','Escalado de la dosificación teórica; requiere comprobar capacidad útil y pérdidas reales.');
    add('Cantidades de lote y costo de materiales','Mi,lote = Mi,por m³ × Vtotal; Mi,mezclada = Mi,por m³ × Vmezclada; costo = Σ(Mi,por m³ × precioki)','Mi: cantidad de cada material en condición de pesaje; precio en USD/kg. No incluye transporte, mano de obra ni equipos.',r.rows.map(x=>`${x.name}: ${fmt(x.wet)} kg/m³; ${fmt(x.price)} USD/kg`).join('; '),r.rows.map(x=>`${fmt(x.wet)} × ${fmt(x.price)}`).join(' + '),`costo/m³ = ${fmt(r.cost)}; costo lote = ${fmt(r.cost*r.batchVolume)}`,'USD','Precios declarados por el usuario; estimación aritmética de materiales.');
    return out;
  }
  function renderSteps(d,r){return steps(d,r).map((s,i)=>`<div class="calculation"><h3><span class="section-number">${String(i+1).padStart(2,'0')}</span>${escapeHTML(s.title)}</h3><div class="formula"><strong>Ecuación:</strong> ${escapeHTML(s.equation)}</div><p><strong>Variables:</strong> ${escapeHTML(s.variables)}</p><p><strong>Datos:</strong> ${escapeHTML(s.inputs)}</p><code><strong>Sustitución:</strong> ${escapeHTML(s.substitution)}</code><p><strong>Resultado:</strong> ${escapeHTML(s.result)} <span class="muted">${escapeHTML(s.unit)}</span></p><p class="tiny muted"><strong>Referencia:</strong> ${escapeHTML(s.reference)}</p></div>`).join('');}
  function table(headers,rows){return `<div class="table-scroll"><table><thead><tr>${headers.map(x=>`<th>${escapeHTML(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${escapeHTML(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  function mixTable(d,r){
    assertResult(r);
    return table(['Árido','Masa seca (kg/m³)','Masa SSS (kg/m³)','Masa húmeda a pesar (kg/m³)'],[['Arena',fmt(r.fine.dry,3),fmt(r.fine.ssd,3),fmt(r.fine.wet,3)],['Grava',fmt(r.coarse.dry,3),fmt(r.coarse.ssd,3),fmt(r.coarse.wet,3)]])+table(['Material / parámetro','Cantidad por m³','Unidad'],[['Cemento',fmt(r.cement,3),'kg'],['Agua efectiva de diseño',fmt(r.water,3),'kg'],['Agua que se debe añadir',fmt(r.addedWater,3),'kg ≈ L'],['Aditivo líquido, producto',fmt(r.admixture,3),'kg'],['Relación a/c efectiva',fmt(r.actualWC,9),'kg/kg'],['Masa total teórica',fmt(r.totalMass,3),'kg'],['Volumen absoluto total',fmt(r.totalVolume,9),'m³'],['Sacos equivalentes',fmt(r.cement/d.bag,6),`sacos de ${given(d.bag)} kg`]]);
  }
  function moistureTable(r){const w=r.rows.find(x=>x.key==='water');return table(['Condición de los áridos','Agua que se debe añadir (kg/m³)','Significado'],[['Secos al horno',fmt(w?.dry,6),'Incluye agua para satisfacer la absorción y descuenta agua del aditivo'],['Saturados superficialmente secos (SSS)',fmt(w?.ssd,6),'Agua efectiva menos agua contenida en el aditivo'],['Con humedades ingresadas',fmt(r.addedWater,6),'Descuenta aportes libres o suma déficits de humedad y descuenta agua del aditivo']]);}
  function experimentalSection(d,r,options){
    const enabled=d.dataMode==='real'&&d.experimentalRecorded===true;
    if(!enabled)return '<p>No se incluyen resultados experimentales: no existe confirmación de ensayos reales ingresados. Los valores de demostración no constituyen evidencia de laboratorio.</p>';
    const fields=[['trialVolume','Volumen nominal de prueba','m³'],['trialDensity','Densidad fresca declarada','kg/m³'],['trialSlump','Asentamiento medido','mm'],['trialAir','Aire medido','%'],['testLoad','Carga de rotura','kN'],['testDiameter','Diámetro medido del cilindro','mm'],['age','Edad de ensayo','días']];
    const entered=fields.filter(([k])=>Number.isFinite(d[k]));
    let html=entered.some(([k])=>d[k]<0)||(Number.isFinite(d.trialAir)&&d.trialAir>100)?'<p class="warning">Hay valores experimentales fuera de rango; revisa el registro. No constituyen resultados validados.</p>':'';html+=entered.length?table(['Dato experimental ingresado','Valor','Unidad'],entered.map(([k,label,unit])=>[label,fmt(d[k]),unit])):'<p>No se ingresaron valores experimentales numéricos.</p>';
    if(Number.isFinite(d.testLoad)&&Number.isFinite(d.testDiameter)){try{const f=E.compression(d.testLoad,d.testDiameter);html+=`<p>Resultado individual de compresión: ${fmt(f,6)} MPa; f = (${fmt(d.testLoad)} × 1000) / (π × ${fmt(d.testDiameter)}² / 4). No es un criterio automático de aceptación de la mezcla.</p>`;}catch(e){html+='<p class="warning">Compresión sin calcular: '+escapeHTML(e.message)+'</p>';}}
    if(Number.isFinite(d.trialVolume)&&Number.isFinite(d.trialDensity)){try{const t=E.trial(r,d.trialVolume,d.trialDensity);html+=`<p>Rendimiento estimado con masa teórica del lote: ${fmt(t.yieldVolume,9)} m³ = ${fmt(t.mass,6)} kg / ${fmt(d.trialDensity,6)} kg/m³. Rendimiento relativo: ${fmt(t.relative,9)}. Si hubo pérdidas o desvíos de pesaje, debe emplearse la masa efectivamente dosificada; no se cambia la predosificación.</p>`;}catch(e){html+='<p class="warning">Rendimiento sin calcular: '+escapeHTML(e.message)+'</p>';}}
    if(typeof options.statsText==='string'&&options.statsText.trim())html+=`<p>Historial de resistencias declarado (MPa): ${escapeHTML(options.statsText)}. Los resultados deben representar ensayos independientes y condiciones comparables.</p>`;
    return html+'<p>La identificación como dato real es una declaración del usuario, no una certificación del procedimiento de ensayo.</p>';
  }
  function gradingSection(g){
    if(Array.isArray(g))return g.length?g.map(gradingSection).join(''):gradingSection(null);
    if(!g||!Array.isArray(g.rows))return '<p>No se adjuntó una evaluación granulométrica a este informe. El módulo Laboratorio permite revisar el balance y los límites aplicables por separado.</p>';
    const rows=g.rows.map(x=>[x.sieve===0?'Fondo':given(x.sieve),fmt(x.mass,3),fmt(x.retained,3),fmt(x.cumulative,3),fmt(x.passing,3)]);
    return '<h3>'+escapeHTML(g.kind==='coarse'?'Agregado grueso':'Agregado fino')+'</h3><p>Fuente: '+escapeHTML(g.source||'Sin envolvente')+' · '+escapeHTML(g.edition||'')+'</p>'+table(['Tamiz (mm)','Retenido (g)','Retenido individual (%)','Acumulado (%)','Pasa (%)'],rows)+`<p>Balance de masas: ${fmt(g.difference,6)} g (${fmt(g.differencePercent,6)} %); masa recuperada: ${fmt(g.total,3)} g. ${Number.isFinite(g.fm)?'Módulo de finura: '+fmt(g.fm,6)+'. ':''}El balance de masas por sí solo no demuestra cumplimiento granulométrico.</p>`+'<p>Evaluación de la envolvente: '+escapeHTML({within:'dentro de los límites seleccionados',outside:'fuera de los límites seleccionados','not-evaluated':'no concluyente'}[g.gradingStatus]||'no evaluada')+'. No es aprobación normativa.</p>'+table(['Tamiz (mm)','Pasa mínimo (%)','Pasa máximo (%)'],(g.limits||[]).map(x=>[given(x.sieve),given(x.min),given(x.max)]))+'<ul>'+(g.violations||[]).map(x=>'<li>'+escapeHTML(x.message)+'</li>').join('')+'</ul>'+(g.referenceUrl?'<p><a href="'+escapeHTML(g.referenceUrl)+'">Documento de la envolvente</a></p>':'')+(Array.isArray(g.warnings)?`<ul>${g.warnings.map(w=>`<li>${escapeHTML(w)}</li>`).join('')}</ul>`:'');
  }
  function buildBody(d,r,options={}){
    assertResult(r);
    const mode=d.dataMode==='real'?'DATOS REALES DECLARADOS POR EL USUARIO':'DATOS DE DEMOSTRACIÓN — NO SON ENSAYOS REALES';
    const materials=[['Cemento: tipo / fuente',given(d.cementType)+' / '+given(d.cementSource),''],['Densidad relativa del cemento',given(d.cementSG),'adimensional'],['Arena: G ingresada / base',given(d.fineSG)+' / '+(d.fineSGBasis||'SSS'),'adimensional'],['Arena: G SSS utilizada',fmt(r.fineSGSSD??d.fineSG),'adimensional'],['Arena: absorción / humedad total',given(d.fineAbs)+' / '+given(d.fineMoist),'% de masa seca'],['Grava: G ingresada / base',given(d.coarseSG)+' / '+(d.coarseSGBasis||'SSS'),'adimensional'],['Grava: G SSS utilizada',fmt(r.coarseSGSSD??d.coarseSG),'adimensional'],['Grava: absorción / humedad total',given(d.coarseAbs)+' / '+given(d.coarseMoist),'% de masa seca'],['Masa unitaria seca compactada de grava',given(d.rodded),'kg/m³'],['Módulo de finura de arena',given(d.fm),'adimensional'],['Agua: origen / características',given(d.waterSource)+' / '+({unknown:'Aptitud pendiente de comprobar',documented:'Con respaldo de aptitud declarado'}[d.waterQuality]||given(d.waterQuality)),''],['Aditivo: identificación',given(d.admName||d.admixtureName),''],['Aditivo: dosis / densidad / agua',given(d.admDose)+' / '+given(d.admDensity)+' / '+given(d.admWater),'% de C / kg/m³ / % de producto']];
    const conditions=[['Resistencia especificada f′c',fmt(d.fc)+' MPa'],['Resistencia media requerida f′cr',fmt(r.strength.value)+' MPa'],['Aplicación',given(d.application)],['Asentamiento objetivo',given(d.targetSlump)+' mm'],['Tamaño máximo nominal',given(d.size)+' mm'],['Exposición declarada',given(d.exposure)],['Límite máximo a/c',d.maxWC>0?fmt(d.maxWC):'No declarado'],['Cemento mínimo / máximo',`${d.minCement>0?fmt(d.minCement):'No declarado'} / ${d.maxCement>0?fmt(d.maxCement):'No declarado'} kg/m³`],['Aire objetivo / incorporado',`${fmt(d.air)} % / ${d.entrained?'sí':'no'}`],['Reducción de agua ingresada',fmt(d.reduction)+' %']];
    const waterBalance=r.addedWater+r.fine.free+r.coarse.free+r.admixtureWater;
    const checks=[['Volumen absoluto total',fmt(r.totalVolume,9)+' m³','Cierre aritmético, objetivo 1 m³'],['Agua efectiva reconstruida',fmt(waterBalance,9)+' kg/m³','Añadida + libres de áridos + agua del aditivo'],['Residuo del balance hídrico',fmt(waterBalance-r.water,12)+' kg/m³','Esperado próximo a cero'],['Masa teórica',fmt(r.totalMass,6)+' kg/m³','No es densidad fresca ensayada'],['Relación a/c efectiva',fmt(r.actualWC,9),d.maxWC>0?(r.actualWC<=d.maxWC+1e-12?'No supera el límite ingresado':'Supera el límite ingresado'):'Límite de exposición sin declarar'],['Cemento máximo',d.maxCement>0?fmt(d.maxCement,3)+' kg/m³':'No declarado',d.maxCement>0?(r.cement<=d.maxCement+1e-9?'No supera la restricción ingresada':'Supera la restricción ingresada'):'Pendiente definir aplicabilidad']];
    const expKeys=/^(trial|test|age$|lab|sieve|coarseSieve|experimentalRecorded$)/;
    const inputs=Object.entries(d).filter(([k])=>!expKeys.test(k)).map(([k,v])=>[k,Array.isArray(v)?v.map(given).join('; '):given(v)]);
    const warnings=Array.isArray(r.warnings)?r.warnings:[];
    let conclusion=`Se obtiene una predosificación de ${fmt(r.cement,3)} kg de cemento y ${fmt(r.water,3)} kg de agua efectiva por m³, con relación a/c ${fmt(r.actualWC,6)}. Con las humedades declaradas se añaden ${fmt(r.addedWater,3)} kg de agua y se pesan ${fmt(r.fine.wet,3)} kg de arena y ${fmt(r.coarse.wet,3)} kg de grava.`;
    if(r.cement>400)conclusion+=' El contenido de cemento es relativamente elevado como orientación práctica, no como incumplimiento normativo. Resulta del agua efectiva y de la relación a/c seleccionada. Pueden estudiarse escenarios con asentamiento compatible con la colocación, TMN compatible con geometría y armaduras, combinación de áridos, historial válido o aditivo comprobado; cualquier cambio exige nueva verificación experimental.';
    if(d.maxCement>0&&r.cement>d.maxCement+1e-9)conclusion+=' La mezcla supera el contenido máximo de cemento ingresado y no satisface esa restricción.';
    conclusion+=' El cierre matemático no aprueba la mezcla. La resistencia, trabajabilidad, aire, rendimiento y durabilidad deben comprobarse con los materiales y las condiciones reales del proyecto.';
    return `<section class="report-cover"><p>UNIVERSIDAD TÉCNICA PARTICULAR DE LOJA · UTPL</p><h1>HormigónLab<br>Memoria de predosificación de hormigón</h1><h2>${escapeHTML(d.name||'Diseño sin nombre')}</h2><p><strong>Responsable:</strong> ${escapeHTML(d.author||'No indicado')}<br><strong>Universidad:</strong> ${escapeHTML(d.university||'Universidad Técnica Particular de Loja (UTPL)')}<br><strong>Carrera:</strong> Ingeniería Civil<br><strong>Asignatura:</strong> ${escapeHTML(d.course||'Diseño de Hormigones')}<br><strong>Docente:</strong> ${escapeHTML(d.teacher||'Ing. Agustín Ruiz')}<br><strong>Generado:</strong> ${escapeHTML(options.generatedAt||new Date().toISOString())}<br><strong>Versión:</strong> ${escapeHTML(options.version||'1.1.0')}</p><p class="warning"><strong>${mode}</strong><br>Predosificación académica de hormigón convencional de densidad normal, pendiente de validación experimental y de requisitos aplicables.</p></section>`+
      `<h2>1. Objetivo del diseño</h2><p>${escapeHTML(d.objective||'Automatizar una predosificación verificable de hormigón convencional mediante caracterización de materiales, condiciones de diseño y correcciones de humedad, explicando el origen de cada cantidad.')}</p>`+
      `<h2>2. Datos de entrada y condiciones de diseño</h2>${table(['Condición','Valor declarado / calculado'],conditions)}<p>Referencia declarada por el usuario: ${escapeHTML(d.reference||'No indicada')}. No se asignan automáticamente límites de durabilidad a partir de una descripción de exposición.</p>`+
      `<h2>3. Propiedades de los materiales</h2>${table(['Propiedad','Valor','Unidad / base'],materials)}<p>Las densidades relativas son adimensionales. La masa unitaria incluye huecos entre partículas; la densidad relativa bulk y el estado SSS describen las partículas y su porosidad permeable. No se utiliza densidad aparente de partículas como sustituto de G bulk.</p>`+

function safeCalc(fn,render){try{return render(fn());}catch(e){return `<div class="error">${esc(e.message)}</div>`;}}
function originBanner(){return `<div class="mode-banner ${data.dataMode==='demo'?'demo':'real'}"><div><strong>${data.dataMode==='demo'?'DATOS DE DEMOSTRACIÓN':'DISEÑO CON DATOS REALES'}</strong><span>${data.dataMode==='demo'?'Ejemplo académico; las propiedades y los ensayos no son mediciones de tus materiales.':'Completa los campos vacíos con tus ensayos y especificaciones. Guardar datos no certifica la mezcla.'}</span></div><div class="toolbar">${action('demo','Cargar demostración')}${action('new-real','Nuevo diseño real',true)}</div></div>`;}
function gradingInput(kind=gradingState.kind){const record=gradingState[kind];return {kind,profileId:record.profileId,customLimits:record.customLimits.filter(r=>r.min!==null||r.max!==null),masses:kind==='fine'?data.sieves:record.masses,initial:kind==='fine'?data.sieveInitial:record.initial,sieves:kind==='fine'?[9.5,4.75,2.36,1.18,.6,.3,.15,.075,0]:record.sieves};}
function currentGradingResult(){try{return {...G.analyze(gradingInput()),kind:gradingState.kind};}catch{return null;}}
function gradingPanel(){const input=gradingInput(),record=gradingState[input.kind],profiles=G.profiles.filter(p=>!p.kind||p.kind===input.kind||p.kind==='both');let r,error='';try{r=G.analyze(input);}catch(e){error=e.message;r={rows:input.sieves.map((sieve,i)=>({sieve,mass:input.masses[i],retained:NaN,cumulative:NaN,passing:NaN})),fm:NaN,total:NaN,differencePercent:NaN,balanceOK:false,gradingStatus:'not-evaluated',violations:[],warnings:[]};}
const selected=G.profiles.find(p=>p.id===input.profileId),limits=input.profileId==='custom'?input.customLimits:(selected?.limits||[]);
const options=[['none','Sin envolvente: solo caracterización'],...profiles.filter(p=>!['none','custom'].includes(p.id)).map(p=>[p.id,p.label]),['custom','Límites personalizados documentados']];
return `<div class="fields"><div class="field"><label for="grade-kind">Árido analizado</label><div class="input-wrap"><select id="grade-kind" data-grade="kind"><option value="fine" ${input.kind==='fine'?'selected':''}>Agregado fino / arena</option><option value="coarse" ${input.kind==='coarse'?'selected':''}>Agregado grueso / grava</option></select></div></div><div class="field"><label for="grade-profile">Envolvente de comparación</label><div class="input-wrap"><select id="grade-profile" data-grade="profile">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===input.profileId?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>${input.kind==='fine'?field('sieveInitial','Masa inicial seca','g'):`<div class="field"><label for="grade-initial">Masa inicial seca de grava</label><div class="input-wrap"><input id="grade-initial" data-grade-initial type="number" step="any" value="${esc(record.initial)}"><span class="unit">g</span></div></div>`}</div>${error?`<div class="error">${esc(error)}</div>`:''}
<div class="result-chip"><span>${input.kind==='fine'?'Módulo de finura de arena':'Masa recuperada de grava'}</span><strong>${input.kind==='fine'?fmt(r.fm,3):fmt(r.total,1)+' g'}</strong></div><p class="tiny muted">Balance de masas: diferencia ${fmt(r.differencePercent,3)}% · ${r.balanceOK?'dentro de ±0,3%':'requiere revisión'}. Esto no evalúa cumplimiento granulométrico.</p>
<div class="table-scroll"><table><thead><tr><th>Tamiz mm</th><th>Retenido g</th><th>Retenido %</th><th>Acum. %</th><th>Pasa %</th><th>Intervalo %</th></tr></thead><tbody>${r.rows.map((row,i)=>{const limit=limits.find(l=>l.sieve===row.sieve),stored=record.customLimits.find(l=>l.sieve===row.sieve);return `<tr><td>${row.sieve?fmt(row.sieve,3):'Fondo'}</td><td><input id="gm-${input.kind}-${i}" class="sieve-input" aria-label="Retenido ${input.kind} ${row.sieve||'fondo'}" type="number" min="0" step="any" ${input.kind==='fine'?`data-sieve="${i}"`:`data-coarse="${i}"`} value="${esc(input.masses[i])}"></td><td>${fmt(row.retained)}</td><td>${fmt(row.cumulative)}</td><td>${fmt(row.passing)}</td><td>${input.profileId==='custom'&&row.sieve>0?`<input id="gl-${i}-min" class="limit-input" type="number" min="0" max="100" step="any" aria-label="Mínimo pasa ${row.sieve}" data-limit-sieve="${row.sieve}" data-limit-bound="min" value="${esc(stored?.min)}">–<input id="gl-${i}-max" class="limit-input" type="number" min="0" max="100" step="any" aria-label="Máximo pasa ${row.sieve}" data-limit-sieve="${row.sieve}" data-limit-bound="max" value="${esc(stored?.max)}">`:limit?`${limit.min}–${limit.max}`:'—'}</td></tr>`;}).join('')}</tbody></table></div>
${error?'':gradingChart(r,limits)}<div class="${r.gradingStatus==='outside'?'warning':'inline-note'}"><strong>${r.gradingStatus==='within'?'Dentro de la envolvente seleccionada':r.gradingStatus==='outside'?'Fuera de la envolvente seleccionada':'Sin evaluación granulométrica concluyente'}</strong><br>${r.gradingStatus==='within'?'Este resultado no demuestra todos los requisitos de la norma ni aprueba la mezcla.':r.gradingStatus==='not-evaluated'?'Selecciona una referencia verificable y completa los datos para comparar.':''}${r.violations?.length?`<ul>${r.violations.map(v=>`<li>${esc(v.message||`Tamiz ${v.sieve} mm: ${fmt(v.actual)}%; requerido ${v.min}–${v.max}%.`)}</li>`).join('')}</ul>`:''}</div>
${r.warnings?.length?`<ul class="tiny muted">${r.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}${r.source?`<p class="tiny muted">Fuente: ${esc(typeof r.source==='string'?r.source:JSON.stringify(r.source))} · ${esc(r.edition||'')}</p>`:''}
${input.kind==='fine'?action('apply-fm','Usar módulo de finura',true,!r.balanceOK||!r.fmComplete||!Number.isFinite(r.fm)):''}`;}
function gradingChart(r,limits){const rows=r.rows.filter(x=>x.sieve>0).slice().reverse(),min=Math.min(...rows.map(x=>x.sieve)),max=Math.max(...rows.map(x=>x.sieve));const x=v=>42+300*Math.log(v/min)/Math.log(max/min),y=v=>180-1.5*Math.max(0,Math.min(100,v));const usable=limits.filter(v=>v.sieve>=min&&v.sieve<=max&&Number.isFinite(v.min)&&Number.isFinite(v.max)).sort((a,b)=>a.sieve-b.sieve);return `<svg class="chart" viewBox="0 0 390 220" role="img" aria-label="Curva granulométrica y envolvente seleccionada, eje logarítmico"><rect width="390" height="220" fill="#fafcf7"/>${[0,25,50,75,100].map(v=>`<line x1="42" x2="350" y1="${y(v)}" y2="${y(v)}" stroke="#e1e7dc"/><text x="10" y="${y(v)+4}" fill="#6a7972" font-size="9">${v}%</text>`).join('')}${usable.length>1?`<polygon points="${usable.map(p=>`${x(p.sieve)},${y(p.min)}`).concat([...usable].reverse().map(p=>`${x(p.sieve)},${y(p.max)}`)).join(' ')}" fill="#d7b680" opacity=".32"/>`:''}<polyline points="${rows.map(p=>`${x(p.sieve)},${y(p.passing)}`).join(' ')}" fill="none" stroke="#32654c" stroke-width="2.5"/>${rows.map(p=>`<circle cx="${x(p.sieve)}" cy="${y(p.passing)}" r="3" fill="#32654c"/><text x="${x(p.sieve)}" y="198" fill="#6a7972" text-anchor="middle" font-size="8">${p.sieve}</text>`).join('')}<text x="196" y="215" font-size="8" text-anchor="middle" fill="#6a7972">Abertura de tamiz (mm), escala logarítmica</text></svg>`;}

card('Masa unitaria compactada','NTE INEN 858 / ASTM C29 · muestra seca compactada.',`<div class="fields">${field('labContainer','Masa del recipiente vacío','kg')}${field('labContainerFull','Recipiente lleno','kg')}${field('labContainerLitres','Volumen calibrado','L')}</div>`+safeCalc(()=>E.bulkDensity(data.labContainer,data.labContainerFull,data.labContainerLitres),v=>`<div class="result-chip"><span>Masa unitaria seca</span><strong>${fmt(v,1)} kg/m³</strong></div>${action('apply-bulk','Usar para grava')}`))+`</div><div>`+
card('Densidad y absorción · grava','NTE INEN 857 / ASTM C127',`<div class="fields">${field('labCoarseDry','Masa seca al horno A','g')}${field('labCoarseSSD','Masa SSS B','g')}${field('labSubmerged','Masa sumergida C','g')}</div>`+safeCalc(()=>E.labCoarse(data.labCoarseDry,data.labCoarseSSD,data.labSubmerged),v=>`<div class="formula">G SSS = B / (B − C)<br>Abs = (B − A) / A × 100</div><div class="result-chip"><span>G SSS / absorción</span><strong>${fmt(v.ssd,3)} / ${fmt(v.abs,2)}%</strong></div><p class="tiny muted">G seca ${fmt(v.od,3)} · G aparente ${fmt(v.apparent,3)}</p>${action('apply-coarse','Usar propiedades de grava',true)}`))+
card('Densidad y absorción · arena','NTE INEN 856 / ASTM C128 · método con picnómetro.',`<div class="fields">${field('labFineDry','Masa seca A','g')}${field('labFineSSD','Masa SSS S','g')}${field('labPycWater','Picnómetro + agua B','g')}${field('labPycSample','Picnómetro + muestra + agua C','g')}</div>`+safeCalc(()=>E.labFine(data.labFineDry,data.labFineSSD,data.labPycWater,data.labPycSample),v=>`<div class="formula">G SSS = S / (B + S − C)<br>Abs = (S − A) / A × 100</div><div class="result-chip"><span>G SSS / absorción</span><strong>${fmt(v.ssd,3)} / ${fmt(v.abs,2)}%</strong></div><p class="tiny muted">G seca ${fmt(v.od,3)} · G aparente ${fmt(v.apparent,3)}</p>${action('apply-fine','Usar propiedades de arena',true)}`))+

function gradationChart(s){const rows=s.rows.slice(0,8).reverse(), pts=rows.map((r,i)=>`${42+i*43},${180-r.passing*1.5}`).join(' ');return `<svg class="chart" viewBox="0 0 390 220" role="img" aria-label="Curva granulométrica de arena, porcentaje que pasa por tamiz"><rect width="390" height="220" fill="#fafcf7"/>${[0,25,50,75,100].map(v=>`<line x1="42" x2="350" y1="${180-v*1.5}" y2="${180-v*1.5}" stroke="#e1e7dc"/><text x="10" y="${184-v*1.5}" fill="#6a7972" font-size="9">${v}%</text>`).join('')}<polyline points="${pts}" fill="none" stroke="#32654c" stroke-width="2.5"/>${rows.map((r,i)=>`<circle cx="${42+i*43}" cy="${180-r.passing*1.5}" r="3" fill="#32654c"/><text x="${42+i*43}" y="198" fill="#6a7972" text-anchor="middle" font-size="8">${r.sieve}</text>`).join('')}<text x="196" y="215" font-size="8" text-anchor="middle" fill="#6a7972">Tamices (mm), espaciado por serie</text></svg>`;}
function mixTable(r,mult=1){return `<div class="table-scroll"><table><thead><tr><th>Material</th><th>Base seca (kg)</th><th>Base SSS (kg)</th><th>Con humedad actual (kg)</th></tr></thead><tbody>${r.rows.filter(row=>row.key!=='water').map(row=>`<tr><td><span class="material-dot" style="--swatch:${colors[row.key]}"></span>${row.name}</td><td>${fmt(row.dry*mult)}</td><td>${fmt(row.ssd*mult)}</td><td><strong>${fmt(row.wet*mult)}</strong></td></tr>`).join('')}</tbody></table></div><div class="table-foot">Las bases seca y SSS se refieren a los áridos. Cemento y aditivo conservan la misma masa de producto.</div>${waterTable(r,mult)}`;}
function waterTable(r,mult=1){const w=r.rows.find(x=>x.key==='water');return `<div class="table-scroll"><table><thead><tr><th>Balance de agua</th><th>kg ≈ L</th></tr></thead><tbody>${[['Agua efectiva de diseño',r.water],['Agua que se añadiría con áridos totalmente secos',w.dry],['Agua que se añadiría con áridos en SSS',w.ssd],['Agua a añadir con la humedad ingresada',w.wet],['Agua libre de arena (negativa = absorción)',r.fine.free],['Agua libre de grava (negativa = absorción)',r.coarse.free],['Agua contenida en el aditivo',r.admixtureWater]].map(([t,v])=>`<tr><td>${t}</td><td><strong>${fmt(v*mult,3)}</strong></td></tr>`).join('')}</tbody></table></div>`;}

function guide(){return heading('Cálculos abiertos. Criterios explícitos.','Consulta el alcance, las referencias y los supuestos antes de adoptar una mezcla.','Versión '+VERSION)+
`<div class="warning"><strong>Alcance técnico.</strong> Se implementa predosificación por volumen absoluto con tablas históricas ACI 211 y referencias de ensayos ASTM/NTE INEN. No existe una guía única obligatoria del curso. La consistencia matemática no demuestra conformidad normativa integral ni validación experimental.</div>`+
card('Cómo está construido el cálculo','Volumen absoluto · hormigón de densidad normal',`<div class="guide-copy"><p>El programa propone una predosificación de hormigón convencional con cemento Portland, arena, grava, agua, aire y un aditivo líquido opcional. Parte de f′c, calcula o recibe f′cr, selecciona agua y a/c, determina cemento y grava, y obtiene la arena por diferencia hasta cerrar 1 m³.</p><p>La relación a/c, el agua y la fracción de grava pueden ingresarse manualmente para adoptar criterios documentados del proyecto. Los límites por exposición y el contenido mínimo de cemento son entradas explícitas; la aplicación no los deduce de una clase ambiental.</p><h3>Tablas automáticas y unidades</h3><p>Agua y a/c: tablas históricas ACI 211 reproducidas en ConcreteWorks (UT Austin / TxDOT, 2010). La fracción compactada de grava coincide con el apéndice E de VDOT (2025). No se presentan como tablas de la edición ACI 211.1-22.</p><p>Conversión: 1 psi = ${E.PSI} MPa; 1 lb/yd³ = ${fmt(E.PCY,9)} kg/m³. El motor interpola linealmente por f′cr y por MF; no extrapola. Los rangos de asentamiento son discretos. TMN automático: 9,5–37,5 mm; MF: 2,4–3,0. Aire incorporado: objetivo ingresado manualmente.</p><h3>Supuestos del balance</h3><p>ρ agua = 1000 kg/m³. Densidades relativas bulk de áridos ingresadas en base seca o SSS, convertidas a SSS antes del balance. Humedad y absorción respecto a masa seca. El aditivo se trata por masa, densidad de producto y fracción de agua; su volumen residual evita duplicar agua. La suma de volúmenes es una aproximación aditiva convencional.</p><h3>Qué requiere comprobación adicional</h3><p>La mezcla se valida con ensayos de trabajabilidad, aire, rendimiento y resistencia. No incluye diseño de hormigón autocompactante, ligero, masivo o de alta resistencia, adiciones cementicias múltiples, bombeabilidad, retracción, calor, durabilidad completa, aceptación estadística de obra ni un diseño estructural. Las calculadoras de ensayo procesan datos y no verifican todo el procedimiento de laboratorio.</p><h3>Guardar y compartir</h3><p>Los proyectos y el autoguardado permanecen en este navegador. Exporta JSON para respaldarlos y abrirlos en otro equipo. CSV exporta cantidades; el informe HTML conserva datos, resultados, supuestos y memoria. Imprimir / PDF usa el diálogo del navegador. La copia portátil funciona sin conexión y sin instalación.</p></div>`)+
`<section class="card"><div class="card-head"><div><h2>Referencias de ensayo para el curso</h2><p>Correspondencias temáticas; las ediciones y equivalencias vigentes deben verificarse.</p></div></div><div class="table-scroll"><table><thead><tr><th>Ensayo / especificación</th><th>NTE INEN</th><th>ASTM</th></tr></thead><tbody>${norms.map(n=>`<tr>${n.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`+
card('Edición de la especificación de áridos','NTE INEN 872: distinguir referencia histórica de edición vigente.','<p class="guide-copy">El Registro Oficial N.º 318, de 3 de julio de 2026, oficializa la segunda revisión de NTE INEN 872. Las envolventes incorporadas aquí corresponden a la primera revisión de 2011, cuyo contenido numérico se pudo contrastar. No se atribuyen a la revisión de 2026 ni certifican cumplimiento de esa edición. <a href="https://www.registroficial.gob.ec/registro-oficial-no-318-21/" target="_blank" rel="noopener noreferrer">Consultar oficialización</a>.</p>')+

card('Tablas incorporadas','Datos numéricos, conversión e interpolación visibles.',`<details><summary>Agua base (kg/m³) y fracción de grava</summary><div class="table-scroll"><table><thead><tr><th>TMN (mm)</th><th>Agua 1–2 in</th><th>Agua 3–4 in</th><th>Agua 6–7 in</th><th>Grava MF 2,8</th></tr></thead><tbody>${E.sizes.map((v,i)=>`<tr><td>${v}</td>${E.waterTable.plain.map(r=>`<td>${fmt(r[i]*E.PCY,3)}</td>`).join('')}<td>${fmt(E.coarseTable[i][2],3)}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted">Agua sin aire incorporado. El código fuente contiene ambas tablas. En los informes se registra el modo y el valor utilizado.</p></details>`);}
function comparisonPanel(){
 const choices=[['current','Mezcla abierta',data],...[21,28,35].map(fc=>['scenario'+fc,'Demostración · '+fc+' MPa',C.scenario(fc)]),...projects.map(p=>['saved:'+p.id,p.data.name+' · '+p.date,P.parse({schemaVersion:p.schemaVersion||1,data:p.data}).data])];
 const a=choices.find(x=>x[0]===comparisonA)||choices[0],b=choices.find(x=>x[0]===comparisonB)||choices[1],c=C.compare(a[2],b[2]);
 const select=(key,value)=>'<div class="field"><label for="compare-'+key+'">Escenario '+key.toUpperCase()+'</label><div class="input-wrap"><select id="compare-'+key+'" data-compare="'+key+'">'+choices.map(([id,label])=>'<option value="'+esc(id)+'" '+(id===value?'selected':'')+'>'+esc(label)+'</option>').join('')+'</select></div></div>';
 const status=(d,r,label)=>'<div class="'+(r.ok?'inline-note':'error')+'"><strong>'+esc(label)+'</strong><p>'+esc(r.ok?'Balance matemático calculado; pendiente de ensayos.':r.errors.join(' '))+'</p><p>Origen: '+(d.dataMode==='demo'?'DEMOSTRACIÓN':'datos reales declarados')+' · a/c máxima: '+(d.maxWC>0?fmt(d.maxWC,3):'sin declarar')+' · cemento mínimo/máximo: '+fmt(d.minCement)+' / '+(d.maxCement>0?fmt(d.maxCement):'sin declarar')+' kg/m³.</p><p>TMN '+fmt(d.size)+' mm · asentamiento objetivo '+fmt(d.targetSlump)+' mm · reducción de agua '+fmt(d.reduction)+'%.</p>'+(r.warnings?.length?'<details><summary>Advertencias del escenario</summary><ul>'+r.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></details>':'')+'</div>';
 return card('Comparador de dos escenarios','Diferencia = B − A. Las demostraciones conservan los mismos materiales; solo cambia f′c.','<div class="fields">'+select('a',a[0])+select('b',b[0])+'</div><div class="two-cols">'+status(a[2],c.left,'A · '+a[1])+status(b[2],c.right,'B · '+b[1])+'</div><div class="table-scroll"><table><thead><tr><th>Parámetro</th><th>A</th><th>B</th><th>B − A</th><th>Unidad</th></tr></thead><tbody>'+c.rows.map(x=>'<tr><td>'+esc(x.label)+'</td><td>'+fmt(x.a,6)+'</td><td>'+fmt(x.b,6)+'</td><td>'+fmt(x.delta,6)+'</td><td>'+x.unit+'</td></tr>').join('')+'</tbody></table></div><p class="tiny muted">La demostración de 35 MPa queda fuera de la tabla automática de a/c al calcular f′cr. Se bloquea sin extrapolar ni inventar una relación manual. Para estudiar otras condiciones, edita la mezcla abierta y guarda otra versión.</p>');
}

function persist(){try{localStorage.setItem(KEY,JSON.stringify({schemaVersion:2,data,projects,statsText,gradingState}));storageOK=true;}catch{storageOK=false;toast('No se pudo guardar en este navegador. Exporta un respaldo JSON.');}}

function filename(ext){return (data.name||'mezcla').replace(/[^a-zA-Z0-9áéíóúñ _-]/g,'').slice(0,75).trim().replace(/ +/g,'-')+'.'+ext;}

function reportOptions(){return {statsText,generatedAt:new Date().toLocaleString('es-EC'),version:VERSION,grading:['fine','coarse'].map(kind=>{try{return G.analyze(gradingInput(kind));}catch{return null;}}).filter(Boolean)};}

let renderTimer;
function updateFromElement(el){
 if(el.dataset.field){const k=el.dataset.field;if(typeof E.defaults[k]==='number')data[k]=el.value.trim()===''?null:Number(el.value);else if(typeof E.defaults[k]==='boolean')data[k]=el.value==='true';else data[k]=el.value;


 }else if(el.dataset.sieve!==undefined){data.sieves[Number(el.dataset.sieve)]=el.value.trim()===''?null:Number(el.value);}
 else if(el.dataset.coarse!==undefined){gradingState.coarse.masses[Number(el.dataset.coarse)]=el.value.trim()===''?null:Number(el.value);}
 else if(el.hasAttribute('data-grade-initial')){gradingState.coarse.initial=el.value.trim()===''?null:Number(el.value);}
 else if(el.dataset.limitSieve!==undefined){const state=gradingState[gradingState.kind],sieve=Number(el.dataset.limitSieve);let limit=state.customLimits.find(r=>r.sieve===sieve);if(!limit){limit={sieve,min:null,max:null};state.customLimits.push(limit);}limit[el.dataset.limitBound]=el.value.trim()===''?null:Number(el.value);}
 else if(el.hasAttribute('data-stats')){statsText=el.value;}
 else return false;
 persist();return true;
}

});
document.addEventListener('change',e=>{

 if(el.dataset.grade){const k=el.dataset.grade;if(k==='kind')gradingState.kind=el.value;else gradingState[gradingState.kind].profileId=el.value;clearTimeout(renderTimer);persist();render();}
 else if(el.dataset.compare){if(el.dataset.compare==='a')comparisonA=el.value;else comparisonB=el.value;render();}
 else if(el.tagName==='SELECT'&&updateFromElement(el)){clearTimeout(renderTimer);render();}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 clearTimeout(renderTimer);result=E.calculate(data);
 try {if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return;}
 if(b.dataset.action){handlers[b.dataset.action]?.();persist();render();}
 if(b.dataset.load){const p=projects.find(p=>p.id===b.dataset.load);if(p){const loaded=P.parse({schemaVersion:p.schemaVersion||1,data:p.data,statsText:p.statsText,gradingState:p.gradingState});save();data=loaded.data;statsText=loaded.statsText;gradingState=loaded.gradingState;page='design';persist();render();toast('Versión cargada.');window.scrollTo(0,0);}}
 if(b.dataset.delete){if(!window.confirm('¿Eliminar esta versión guardada? La mezcla abierta no se modifica.'))return;projects=projects.filter(p=>p.id!==b.dataset.delete);persist();render();toast('Versión eliminada.');}
 }catch(err){toast(err.message);}
});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw new Error('El archivo supera 2 MB.');const obj=JSON.parse(await file.text()), parsed=P.parse(obj);save();data=parsed.data;statsText=parsed.statsText;gradingState=parsed.gradingState;page='design';persist();render();toast('Proyecto importado. La mezcla anterior quedó guardada.');}catch(err){toast('No se importó: '+err.message);}e.target.value='';});
window.addEventListener('beforeunload',persist);
render();
})();
</script></body></html>
